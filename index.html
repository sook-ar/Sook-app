<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق البيع والشراء</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
        }

        /* Header / الشريط العلوي */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            background: #eef2f5;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .header-btn:hover {
            background: #e2e8f0;
        }

        .lang-select {
            padding: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            font-size: 13px;
        }

        /* Container / المحتوى الرئيسي */
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* Post Card / بطاقة المنشور والمنتج */
        .post-card {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .post-header {
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .seller-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #27ae60;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .seller-info h4 {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .seller-info span {
            font-size: 11px;
            color: #777;
        }

        .product-image {
            width: 100%;
            height: 250px;
            background-color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }

        .product-details {
            padding: 15px;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 15px;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-description {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
        }

        /* Post Actions / أزرا التفاعل أسفل كل منشور */
        .post-actions {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 5px 0;
            background: #fafafa;
        }

        .action-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 0;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .action-btn:hover {
            background: #f0f0f0;
        }

        .action-btn.liked {
            color: #e74c3c;
        }

        .action-btn.saved {
            color: #f39c12;
        }

        /* Comments Section / قسم التعليقات */
        .comments-section {
            padding: 12px 15px;
            background: #fff;
        }

        .comment-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .comment-input-group input {
            flex: 1;
            padding: 7px 12px;
            border: 1px solid #ccc;
            border-radius: 15px;
            font-size: 12px;
            outline: none;
        }

        .comment-input-group button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment-item {
            font-size: 12px;
            background: #f4f6f8;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .comment-item strong {
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Header: شريط التحكم العلوي -->
    <header>
        <div class="logo">متجري</div>
        
        <div class="header-controls">
            <!-- تغيير اللغة -->
            <select class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>

            <!-- زر الملف الشخصي -->
            <button class="header-btn" onclick="openProfile()">👤 الملف الشخصي</button>
            
            <!-- زر الإعدادات -->
            <button class="header-btn" onclick="openSettings()">⚙️ الإعدادات</button>
        </div>
    </header>

    <!-- Content: المنشورات والمنتجات -->
    <div class="container">

        <!-- المنشور الأول -->
        <div class="post-card">
            <div class="post-header">
                <div class="seller-avatar">ع</div>
                <div class="seller-info">
                    <h4>علي السلاوي</h4>
                    <span>قبل 15 دقيقة • الدار البيضاء</span>
                </div>
            </div>

            <!-- صورة المنتج -->
            <div class="product-image">
                [صورة صورة الهاتف / المنتج]
            </div>

            <div class="product-details">
                <div class="product-title">هاتف مستعمل بحالة ممتازة</div>
                <div class="product-price">2500 درهم</div>
                <div class="product-description">
                    للبيع هاتف ممتازي بدون أي عيوب، مع الشاحن والعلبة الأصلية.
                </div>
            </div>

            <!-- أزرار التفاعل تحت المنشور -->
            <div class="post-actions">
                <button class="action-btn" onclick="toggleLike(this)">❤️ إعجاب</button>
                <button class="action-btn" onclick="focusComment('comment-1')">💬 تعليق</button>
                <button class="action-btn" onclick="sharePost()">↗️ مشاركة</button>
                <button class="action-btn" onclick="toggleSave(this)">🔖 حفظ</button>
            </div>

            <!-- التعليقات -->
            <div class="comments-section">
                <div class="comment-input-group">
                    <input type="text" id="comment-1" placeholder="اكتب تعليقاً واسأل البائع...">
                    <button onclick="addComment('comment-1', 'list-1')">إرسال</button>
                </div>
                <div class="comments-list" id="list-1">
                    <div class="comment-item">
                        <strong>ياسين:</strong> واش السعر قابل للتفاوض؟
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript الأساسي للتفاعلات -->
    <script>
        function openProfile() {
            alert("فتح شاشة الملف الشخصي");
        }

        function openSettings() {
            alert("فتح شاشة الإعدادات");
        }

        function changeLanguage(lang) {
            alert("تم تغيير اللغة إلى: " + lang);
        }

        function toggleLike(btn) {
            btn.classList.toggle('liked');
            if(btn.classList.contains('liked')) {
                btn.innerHTML = "❤️ تم الإعجاب";
            } else {
                btn.innerHTML = "❤️ إعجاب";
            }
        }

        function toggleSave(btn) {
            btn.classList.toggle('saved');
            if(btn.classList.contains('saved')) {
                btn.innerHTML = "🔖 تم الحفظ";
            } else {
                btn.innerHTML = "🔖 حفظ";
            }
        }

        function sharePost() {
            alert("تم نسخ رابط المنشور للمشاركة");
        }

        function focusComment(inputId) {
            document.getElementById(inputId).focus();
        }

        function addComment(inputId, listId) {
            let input = document.getElementById(inputId);
            let text = input.value.trim();
            if(text !== "") {
                let list = document.getElementById(listId);
                let newComment = document.createElement('div');
                newComment.className = 'comment-item';
                newComment.innerHTML = '<strong>أنت:</strong> ' + text;
                list.appendChild(newComment);
                input.value = "";
            }
        }
    </script>
</body>
</html>
